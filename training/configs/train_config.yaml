# DRISHTI-X — EfficientNet-B0 Training Configuration
# Datasets: APTOS 2019 (2563) + IDRiD (516) = 3079 images
# Run: python training/train_efficientnet.py

model:
  architecture: efficientnet_b0
  pretrained: true
  num_classes: 5
  dropout: 0.4
  image_size: 224

dataset:
  # Combined APTOS 2019 + IDRiD
  combined_csv: "datasets/combined_train.csv"
  image_col: "image_path"   # full paths already in combined CSV
  label_col: "label"
  val_split: 0.15
  test_split: 0.15
  num_workers: 0            # 0 for macOS stability

training:
  epochs: 30
  batch_size: 16
  learning_rate: 2.0e-4
  weight_decay: 1.0e-4
  early_stopping_patience: 8
  lr_scheduler: cosine
  warmup_epochs: 2

loss:
  type: weighted_cross_entropy

augmentation:
  train:
    - RandomHorizontalFlip
    - RandomVerticalFlip
    - RandomRotation: 20
    - ColorJitter:
        brightness: 0.3
        contrast: 0.3
        saturation: 0.2
    - RandomResizedCrop: 224
  val:
    - Resize: 256
    - CenterCrop: 224

checkpointing:
  save_dir: "models/weights"
  save_best_only: true
  metric: val_f1

logging:
  log_dir: "training/logs"
  log_interval: 20

reproducibility:
  seed: 42
